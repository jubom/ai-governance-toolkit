# PII & Sensitive Data Tag Taxonomy
# A starting standard for tagging sensitive columns in a data catalog.
# Adapt categories, tiers, and handling rules to your regulatory context.

version: 1.0
owner: Data Governance
approvers: [Security, Privacy, Legal]

tags:
  pii:
    description: Category of personal or sensitive data held in the column.
    allowed_values:
      - government_id      # SSN, national ID, tax ID, passport
      - financial_id       # account, card, or routing numbers
      - email
      - phone
      - personal_name
      - date_of_birth
      - license_info       # driver's or professional license data
      - street_address
      - postal_code
      - precise_location   # GPS or geolocation
      - health             # any health-related data
  pii_risk:
    description: Handling tier, independent of category, so high-risk data can be queried directly.
    allowed_values: [high, medium, low]

risk_tiers:
  high:
    examples: [government_id, financial_id, email, phone, personal_name, date_of_birth, license_info, health]
    required_controls:
      - Tag before any downstream use
      - Column mask for broad-audience tables
      - Access review at least quarterly
      - Excluded from AI training and retrieval unless explicitly approved
  medium:
    examples: [street_address, postal_code, precise_location]
    required_controls:
      - Tag before any downstream use
      - Mask or aggregate in broad-audience tables
      - Approval required before AI use
  low:
    examples: [city, region, country]
    required_controls:
      - Tag where combined with other personal data (re-identification risk)

ai_use_rules:
  default: deny_high_risk
  notes: >
    Columns tagged pii_risk=high are not available to AI agents, copilots, retrieval
    indexes, or model training unless an approved exception records the purpose,
    owner, and control (for example masking or tokenization).

operational_rules:
  - New tables are tagged at creation as part of schema review.
  - A scheduled scan (at least quarterly) identifies new untagged sensitive columns.
  - Tag coverage is reported alongside other data quality metrics.
